services:
  caddy:
    image: caddy:2-alpine
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?Set your public DNS hostname in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
