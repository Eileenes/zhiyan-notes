<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>只言 · 界面原型</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="platform.css">
<link rel="stylesheet" href="garden.css">
<link rel="stylesheet" href="service.css">
<script>
/* 首屏前定好主题，避免浅底闪一下深底。
   优先级与 app.js 内保持一致：URL 参数 > localStorage > 跟随系统 */
(function () {
  try {
    var u = new URLSearchParams(location.search).get('theme');
    var p = ['system','light','dark'].indexOf(u) >= 0 ? u
          : (localStorage.getItem('mn-theme') || 'system');
    var d = p === 'system'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : p;
    document.documentElement.dataset.theme = d;
    document.documentElement.style.colorScheme = d;
  } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
})();
</script>
</head>
<body class="proto-stage-mac">

<!-- 原型控制条 —— 明确不属于产品设计 -->
<div class="proto-bar">
  <span class="pb-title">macOS</span>
  <span class="pb-sep"></span>
  <div class="proto-switch">
    <button data-plat="mac" class="on">macOS</button>
    <button data-plat="ios">iOS</button>
  </div>
  <span class="pb-sep"></span>
  <div class="proto-switch">
    <button data-act="theme" data-v="system">系统</button>
    <button data-act="theme" data-v="light">浅色</button>
    <button data-act="theme" data-v="dark">深色</button>
  </div>
  <span class="pb-sep pb-desc"></span>
  <span class="pb-desc">左侧导航切换页面 · 麦克风按钮进入录音态 · 搜索页可看有结果/无结果两种状态</span>
  <span class="proto-hint">原型演示，非最终设计</span>
</div>

<div class="proto-stage" id="stage"></div>

<script src="runtime.js"></script>
<script src="data.js"></script>
<script src="db.js"></script>
<script src="icons.js"></script>
<script src="garden.js"></script>
<script src="services.js"></script>
<script src="service-views.js"></script>
<script src="gateway.js"></script>
<script src="privacy.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
