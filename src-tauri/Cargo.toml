[package]
name = "zhiyan-app"
version = "0.7.0"
edition = "2021"

[lib]
name = "zhiyan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zhiyan-core = { path = "../core" }
tauri-plugin-zhiyan-credentials = { path = "../plugins/credentials" }
