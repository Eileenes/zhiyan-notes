# XcodeGen spec for the native Apple apps (macOS + iOS).
#   brew install xcodegen
#   apple/scripts/build-xcframework.sh   # Rust core -> apple/build/ZhiYanCore.xcframework
#   cd apple && xcodegen generate        # -> apple/ZhiYan.xcodeproj (not committed)
# Source of truth stays in build/*.swift, core/ and prototype/; the generated
# project only references them, so build/build.sh keeps working unchanged.
name: ZhiYan
options:
  bundleIdPrefix: com.duketao
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "0.7"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # set your Team ID locally (or via xcconfig); never commit secrets
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    OTHER_LDFLAGS: ["-lc++"]
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targetTemplates:
  ZhiYanApp:
    type: application
    sources:
      - path: Sources/main.swift          # symlink -> build/shell.swift (top-level code needs main.swift)
      - path: ../build/Data.swift
      - path: ../build/Audio.swift
      - path: ../build/Services.swift
      - path: ../build/NativeBridge.swift
      - path: ../build/Diagnostics.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: build/ZhiYanCore.xcframework
        embed: false                       # static library inside the XCFramework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build Rust core XCFramework (if missing)
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "$SRCROOT/build/ZhiYanCore.xcframework" ] || [ "${ZY_REBUILD_CORE:-0}" = 1 ]; then
            "$SRCROOT/scripts/build-xcframework.sh"
          fi
    postCompileScripts:
      - name: Stage web UI
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/stage-web.sh"'

targets:
  ZhiYan-macOS:
    templates: [ZhiYanApp]
    platform: macOS
    sources:
      - path: ../icon/MemoryNotes.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: 只言
        PRODUCT_BUNDLE_IDENTIFIER: com.duketao.zhiyan
        INFOPLIST_FILE: Config/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/ZhiYan-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES

  ZhiYan-iOS:
    templates: [ZhiYanApp]
    platform: iOS
    sources:
      - path: Assets.xcassets              # AppIcon (single 1024 image, symlinked from icon/)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: ZhiYan
        PRODUCT_BUNDLE_IDENTIFIER: com.duketao.zhiyan
        INFOPLIST_FILE: Config/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/ZhiYan-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  ZhiYan-macOS:
    build: {targets: {ZhiYan-macOS: all}}
    run: {config: Debug}
    archive: {config: Release}
  ZhiYan-iOS:
    build: {targets: {ZhiYan-iOS: all}}
    run: {config: Debug}
    archive: {config: Release}
